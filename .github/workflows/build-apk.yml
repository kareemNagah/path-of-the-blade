name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: npm install

      - run: "[ -d android ] || npx cap add android"

      - run: npx cap sync android

      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: path-of-the-blade-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - run: cp android/app/build/outputs/apk/debug/app-debug.apk path-of-the-blade.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Path of the Blade · build ${{ github.run_number }}
          make_latest: true
          files: path-of-the-blade.apk
